services:
  - type: web
    name: my-searxng-instance
    runtime: docker
    repo: https://github.com/searxng/searxng # Pulls official code
    plan: free # Change to 'starter' if you need it to never sleep
    envVars:
      - key: SEARXNG_SETTINGS_PATH
        value: /etc/searxng/settings.yml
      - key: PORT
        value: 8080
    dockerContext: .
    dockerfilePath: Dockerfile
